[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-forensics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.1",
    "librosa>=0.10.0",
    "mutagen>=1.47.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
deep = [
    "transformers>=4.35.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
music-forensics = "music_forensics.cli:main"
